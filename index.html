<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Manager Resources</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pine: #1f2e23;
    --pine-light: #2c4032;
    --bone: #f7f5f0;
    --panel: #ffffff;
    --brass: #b08d57;
    --text: #262220;
    --muted: #6b6459;
    --border: #ddd6c9;
    --error: #a13d2a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bone);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
  }

  /* ---------- Gate screen ---------- */

  #gate {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .gate-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 40px 36px;
    width: 100%;
    max-width: 360px;
    text-align: center;
  }

  .gate-card h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 26px;
    margin: 0 0 8px;
    color: var(--pine);
  }

  .gate-card p {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
  }

  .gate-card input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 15px;
    font-family: inherit;
    margin-bottom: 14px;
  }

  .gate-error {
    color: var(--error);
    font-size: 13px;
    min-height: 18px;
    margin-bottom: 10px;
  }

  /* ---------- App shell ---------- */

  #app {
    display: none;
    min-height: 100vh;
    flex-direction: column;
  }

  header.top {
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  header.top h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 21px;
    margin: 0;
    color: var(--pine);
  }

  header.top span {
    font-size: 13px;
    color: var(--muted);
  }

  .layout {
    flex: 1;
    display: grid;
    grid-template-columns: 240px 1fr;
    min-height: 0;
  }

  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; }
    nav.side { border-right: none; border-bottom: 1px solid var(--border); }
  }

  nav.side {
    border-right: 1px solid var(--border);
    padding: 18px 12px;
    overflow-y: auto;
  }

  nav.side .group-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 18px 10px 6px;
  }

  nav.side .group-label:first-child { margin-top: 0; }

  nav.side button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 9px 10px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
  }

  nav.side button:hover { background: rgba(31, 46, 35, 0.06); }
  nav.side button.active { background: var(--pine); color: var(--bone); }

  main.content {
    padding: 32px 40px;
    overflow-y: auto;
  }

  .doc h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 26px;
    color: var(--pine);
    margin: 0 0 18px;
  }

  .doc p {
    max-width: 640px;
    line-height: 1.65;
    font-size: 15px;
    white-space: pre-wrap;
  }

  /* ---------- Assistant chat ---------- */

  .chat-wrap {
    display: flex;
    flex-direction: column;
    height: 100%;
    max-width: 720px;
  }

  .chat-log {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding-bottom: 16px;
  }

  .bubble {
    max-width: 85%;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
  }

  .bubble.user {
    align-self: flex-end;
    background: var(--pine);
    color: var(--bone);
  }

  .bubble.assistant {
    align-self: flex-start;
    background: var(--panel);
    border: 1px solid var(--border);
  }

  .bubble.assistant.error { color: var(--error); border-color: var(--error); }

  .chat-hint {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
    padding: 8px 0 20px;
  }

  .chat-input-row {
    display: flex;
    gap: 10px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }

  .chat-input-row textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14.5px;
    line-height: 1.4;
    min-height: 44px;
    max-height: 140px;
  }

  .chat-input-row button {
    background: var(--pine);
    color: var(--bone);
    border: none;
    border-radius: 8px;
    padding: 0 20px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .chat-input-row button:disabled { background: var(--border); color: var(--muted); cursor: default; }

  button.primary {
    background: var(--pine);
    color: var(--bone);
    border: none;
    padding: 12px 0;
    border-radius: 7px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }

  button.primary:hover:not(:disabled) { background: var(--pine-light); }
  button.primary:disabled { background: var(--border); color: var(--muted); cursor: default; }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <h1>Manager Resources</h1>
    <p>Enter the access code to view Saint Bernard's manager reference library and assistant.</p>
    <div class="gate-error" id="gateError"></div>
    <input type="password" id="codeInput" placeholder="Access code" autofocus />
    <button class="primary" id="enterBtn">Enter</button>
  </div>
</div>

<div id="app">
  <header class="top">
    <h1>Manager Resources</h1>
    <span>Saint Bernard</span>
  </header>
  <div class="layout">
    <nav class="side" id="sideNav"></nav>
    <main class="content" id="mainContent"></main>
  </div>
</div>

<script>
  const gate = document.getElementById('gate');
  const app = document.getElementById('app');
  const codeInput = document.getElementById('codeInput');
  const enterBtn = document.getElementById('enterBtn');
  const gateError = document.getElementById('gateError');
  const sideNav = document.getElementById('sideNav');
  const mainContent = document.getElementById('mainContent');

  let CODE = '';
  let CONTENT = null;
  let chatHistory = []; // { role, content }

  async function tryEnter(code) {
    gateError.textContent = '';
    enterBtn.disabled = true;
    enterBtn.textContent = 'Checking…';
    try {
      const verifyRes = await fetch('/api/verify', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ code }),
      });
      if (!verifyRes.ok) {
        const d = await verifyRes.json().catch(() => ({}));
        gateError.textContent = d.error || 'That code is not correct.';
        return false;
      }
      const contentRes = await fetch('/api/content', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ code }),
      });
      if (!contentRes.ok) {
        gateError.textContent = 'Could not load the resource library. Try again.';
        return false;
      }
      CONTENT = await contentRes.json();
      CODE = code;
      sessionStorage.setItem('mrs_code', code);
      showApp();
      return true;
    } catch (err) {
      gateError.textContent = 'Could not reach the server. Try again.';
      return false;
    } finally {
      enterBtn.disabled = false;
      enterBtn.textContent = 'Enter';
    }
  }

  enterBtn.addEventListener('click', () => {
    const code = codeInput.value.trim();
    if (!code) return;
    tryEnter(code);
  });
  codeInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') enterBtn.click();
  });

  function showApp() {
    gate.style.display = 'none';
    app.style.display = 'flex';
    buildNav();
    showAssistant();
  }

  function buildNav() {
    sideNav.innerHTML = '';

    const assistantBtn = document.createElement('button');
    assistantBtn.textContent = 'Ask the Assistant';
    assistantBtn.dataset.kind = 'assistant';
    sideNav.appendChild(assistantBtn);

    const addGroup = (label, items) => {
      const groupLabel = document.createElement('div');
      groupLabel.className = 'group-label';
      groupLabel.textContent = label;
      sideNav.appendChild(groupLabel);
      items.forEach((item) => {
        const btn = document.createElement('button');
        btn.textContent = item.title;
        btn.dataset.kind = 'doc';
        btn.dataset.id = item.id;
        sideNav.appendChild(btn);
      });
    };

    addGroup('Policies', CONTENT.policies);
    addGroup('How-Tos', CONTENT.howtos);

    sideNav.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      [...sideNav.querySelectorAll('button')].forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      if (btn.dataset.kind === 'assistant') showAssistant();
      else showDoc(btn.dataset.id);
    });

    assistantBtn.classList.add('active');
  }

  function showDoc(id) {
    const all = [...CONTENT.policies, ...CONTENT.howtos];
    const doc = all.find((d) => d.id === id);
    if (!doc) return;
    mainContent.innerHTML = `<div class="doc"><h2>${escapeHtml(doc.title)}</h2><p>${escapeHtml(doc.body)}</p></div>`;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function showAssistant() {
    mainContent.innerHTML = `
      <div class="chat-wrap">
        <div class="chat-log" id="chatLog"></div>
        <div class="chat-input-row">
          <textarea id="chatInput" placeholder="Ask about a policy, or describe what you need help drafting…"></textarea>
          <button id="chatSend">Send</button>
        </div>
      </div>
    `;
    const chatLog = document.getElementById('chatLog');
    const chatInput = document.getElementById('chatInput');
    const chatSend = document.getElementById('chatSend');

    renderChatLog();

    if (chatHistory.length === 0) {
      chatLog.innerHTML = `<div class="chat-hint">Ask a question about the policies and how-tos in this library, or describe something you need to draft — a review, a PIP, a message to a direct report, an announcement. Nothing here is saved once you close the tab.</div>`;
    }

    function renderChatLog() {
      if (chatHistory.length === 0) return;
      chatLog.innerHTML = '';
      chatHistory.forEach((m) => {
        const div = document.createElement('div');
        div.className = `bubble ${m.role}${m.error ? ' error' : ''}`;
        div.textContent = m.content;
        chatLog.appendChild(div);
      });
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    async function send() {
      const text = chatInput.value.trim();
      if (!text) return;
      chatHistory.push({ role: 'user', content: text });
      chatInput.value = '';
      renderChatLog();
      chatSend.disabled = true;
      chatSend.textContent = '…';

      try {
        const res = await fetch('/api/assistant', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ code: CODE, messages: chatHistory }),
        });
        const data = await res.json();
        if (!res.ok) {
          chatHistory.push({ role: 'assistant', content: data.error || 'Something went wrong.', error: true });
        } else {
          chatHistory.push({ role: 'assistant', content: data.reply });
        }
        renderChatLog();
      } catch (err) {
        chatHistory.push({ role: 'assistant', content: 'Could not reach the server. Try again.', error: true });
        renderChatLog();
      } finally {
        chatSend.disabled = false;
        chatSend.textContent = 'Send';
      }
    }

    chatSend.addEventListener('click', send);
    chatInput.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') send();
    });
  }

  // If this tab already verified a code this session, skip the gate.
  (function tryStoredCode() {
    const stored = sessionStorage.getItem('mrs_code');
    if (stored) tryEnter(stored);
  })();
</script>

</body>
</html>
